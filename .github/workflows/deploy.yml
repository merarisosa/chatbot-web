name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        port: 22
        script: |
          cd /root/chatbot-web

          echo "🔄 Actualizando repositorio..."
          git pull || { echo 'git pull failed'; exit 1; }

          echo "🛑 Deteniendo contenedor anterior..."
          docker stop chatbot-web || true

          echo "🧹 Eliminando contenedor viejo..."
          docker rm chatbot-web || true

          echo "🏗️ Construyendo nueva imagen Docker..."
          docker build -t chatbot-web .

          echo "🚀 Levantando contenedor nuevo..."
          docker run -d \
            --name chatbot-web \
            -p 8010:8000 \
            --env-file .env \
            chatbot-web

          echo "🔗 Conectando a red n8n_n8n-network..."
          docker network connect n8n_n8n-network chatbot-web || true

          echo "🎉 DEPLOY TERMINADO"
