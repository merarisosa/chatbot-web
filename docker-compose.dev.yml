# ============================

version: '3.9'

services:
  chatbot-web:
    build: .
    container_name: chatbot-web-dev
    ports:
      - "8010:8000"
    volumes:
      - .:/app 
    env_file:
      - .env-dev            
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
